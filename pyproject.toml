[project]
name = "owl"
version = "0.1.0"
description = "Grounded field-update suggestions from OCR'd document bundles."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "pydantic-ai-slim>=0.0.50",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.110",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "import-linter>=2.0",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owl"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/owl/domain", "src/owl/application"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=owl.domain --cov=owl.application --cov-report=term-missing:skip-covered"

[tool.coverage.report]
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\."]

[tool.importlinter]
root_package = "owl"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = ["owl.entrypoints", "owl.infrastructure", "owl.application", "owl.domain"]

[[tool.importlinter.contracts]]
name = "Application imports only domain"
type = "forbidden"
source_modules = ["owl.application"]
forbidden_modules = ["owl.infrastructure", "owl.entrypoints"]

[[tool.importlinter.contracts]]
name = "Domain and application are free of I/O frameworks"
type = "forbidden"
source_modules = ["owl.domain", "owl.application"]
forbidden_modules = ["pydantic_ai", "fastapi", "opentelemetry", "httpx", "yaml", "structlog"]
allow_indirect_imports = true
